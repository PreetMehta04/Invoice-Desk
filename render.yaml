# Deploy on Render: New + > Blueprint > select this repo. Then add ONE API key under Environment.
# Free plan: data is reset when the service restarts (fine for demos — there's a Reset button anyway),
# and the service sleeps after ~15 min idle, so open the URL a minute before you demo.
services:
  - type: web
    name: invoice-desk
    runtime: docker
    plan: free
    healthCheckPath: /api/health
    envVars:
      - key: EXTRACTION_PROVIDER
        value: auto
      - key: GEMINI_MODEL
        value: gemini-3.1-flash-lite
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      - key: OPENAI_API_KEY
        sync: false
